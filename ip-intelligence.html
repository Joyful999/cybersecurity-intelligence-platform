<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP Intelligence — SENTINEL-X</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><path d=%22M16 2L28 7v8c0 8-5 13-12 15C9 28 4 23 4 15V7L16 2z%22 fill=%22%234f7cff%22/></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app-root"></div>

<div id="page-slot" style="display:none">
  <div class="panel">
    <div class="ip-hero">
      <h2>Analyze an IP Address</h2>
      <p>Retrieve geolocation, network, and security intelligence for any IPv4 or IPv6 address</p>
      <div class="ip-search-row">
        <input class="input mono" id="ip-input" placeholder="Enter IPv4 or IPv6 address" autocomplete="off">
        <button class="btn btn-primary" id="ip-analyze">Analyze IP</button>
      </div>
      <div class="ip-quick">
        <span class="text-tertiary" style="font-size:11px;">Try:</span>
        <button data-ip="8.8.8.8">8.8.8.8</button>
        <button data-ip="1.1.1.1">1.1.1.1</button>
        <button data-ip="my-ip">My IP</button>
      </div>
      <div id="ip-error" style="display:none;margin-top:14px;color:var(--sev-critical);font-size:12.5px;"></div>
    </div>
  </div>

  <div id="ip-loading" style="display:none;margin-top:18px;">
    <div class="skel" style="height:280px;border-radius:14px;"></div>
  </div>

  <div id="ip-results" style="display:none;">
    <div class="flex items-center justify-between" style="margin:22px 0 4px;">
      <h3 style="font-size:15px;" id="ip-result-title">Results</h3>
      <div class="flex gap-8">
        <button class="btn btn-sm" id="ip-copy">Copy IP</button>
        <button class="btn btn-sm" id="ip-export">Export Report</button>
      </div>
    </div>
    <div class="ip-result-grid">
      <div class="panel">
        <div class="panel-head"><h3>IP Information</h3><span class="badge badge-neutral" id="ip-source-badge">LIVE</span></div>
        <div class="panel-body"><div class="info-list" id="ip-info-list"></div></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Location</h3></div>
        <div class="panel-body"><div id="ip-map"></div></div>
      </div>
      <div class="panel" style="grid-column: 1 / -1;">
        <div class="panel-head"><h3>Security Information</h3><span class="sub">Proxy, VPN, hosting and reputation signals</span></div>
        <div class="panel-body">
          <div class="sec-flags" id="ip-sec-flags"></div>
          <div style="margin-top:16px;">
            <div class="flex justify-between" style="font-size:11.5px;color:var(--text-tertiary);margin-bottom:4px;">
              <span>Threat Score</span><span id="ip-score-label">—</span>
            </div>
            <div class="threat-score-bar"><div class="threat-score-fill" id="ip-score-fill" style="width:0%;"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/ip-intelligence.js"></script>
<script>
  SXApp.mount({ title: 'IP Intelligence', crumbs: 'SENTINEL-X / IP Intelligence' });
  SXIpIntel.init();
</script>
</body>
</html>
