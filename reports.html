<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Reports — SENTINEL-X</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><path d=%22M16 2L28 7v8c0 8-5 13-12 15C9 28 4 23 4 15V7L16 2z%22 fill=%22%234f7cff%22/></svg>">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app-root"></div>

<div id="page-slot" style="display:none">
  <div class="page-head">
    <div>
      <h2>Security Reports</h2>
      <p>Generate a print-ready summary of threats, incidents, and vulnerabilities</p>
    </div>
  </div>

  <div class="grid grid-12" style="align-items:start;">
    <div class="panel col-span-4">
      <div class="panel-head"><h3>Report Configuration</h3></div>
      <div class="panel-body">
        <div class="field"><label>Report Title</label><input class="input" id="rp-title" value="Weekly Security Summary"></div>
        <div class="field">
          <label>Date Range</label>
          <div class="input-group">
            <input class="input" id="rp-from" type="date">
            <input class="input" id="rp-to" type="date">
          </div>
        </div>
        <div class="field">
          <label>Include Sections</label>
          <div class="flex-col gap-8" style="margin-top:4px;">
            <label class="flex items-center gap-8"><input type="checkbox" id="rp-inc-threats" checked> Threat statistics</label>
            <label class="flex items-center gap-8"><input type="checkbox" id="rp-inc-incidents" checked> Incident statistics</label>
            <label class="flex items-center gap-8"><input type="checkbox" id="rp-inc-vulns" checked> Vulnerability statistics</label>
            <label class="flex items-center gap-8"><input type="checkbox" id="rp-inc-geo" checked> Geographic information</label>
            <label class="flex items-center gap-8"><input type="checkbox" id="rp-inc-findings" checked> Key findings</label>
          </div>
        </div>
        <button class="btn btn-primary w-full" id="rp-generate">Generate Report</button>
        <div class="flex gap-8" style="margin-top:10px;">
          <button class="btn w-full" id="rp-print">Print</button>
          <button class="btn w-full" id="rp-export">Export</button>
        </div>
      </div>
    </div>

    <div class="panel col-span-8">
      <div class="panel-head"><h3>Preview</h3><span class="sub">Print-ready — use Print for PDF output</span></div>
      <div class="panel-body">
        <div id="report-output"><div class="state-block"><div class="title">No report generated yet</div><div class="desc">Configure options on the left and click Generate Report.</div></div></div>
      </div>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/reports.js"></script>
<script>
  SXApp.mount({ title: 'Security Reports', crumbs: 'SENTINEL-X / Reports' });
  SXReports.init();
</script>
</body>
</html>
