<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Intelligence — SENTINEL-X</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><path d=%22M16 2L28 7v8c0 8-5 13-12 15C9 28 4 23 4 15V7L16 2z%22 fill=%22%234f7cff%22/></svg>">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app-root"></div>

<div id="page-slot" style="display:none">
  <div class="page-head">
    <div>
      <h2>Network Intelligence</h2>
      <p>Traffic, protocol, and geographic telemetry across monitored network segments</p>
    </div>
    <span class="badge badge-neutral">DEMO TELEMETRY</span>
  </div>

  <div class="net-stat-row" id="net-stats"></div>

  <div class="grid grid-12" style="margin-bottom:18px;">
    <div class="panel col-span-8">
      <div class="panel-head"><div><h3>Traffic Over Time</h3><div class="sub">Requests per minute, last 30 minutes</div></div></div>
      <div class="chart-wrap" style="height:260px;"><canvas id="chart-traffic"></canvas></div>
    </div>
    <div class="panel col-span-4">
      <div class="panel-head"><h3>Requests by Protocol</h3></div>
      <div class="chart-wrap" style="height:260px;"><canvas id="chart-protocols"></canvas></div>
    </div>
  </div>

  <div class="grid grid-12">
    <div class="panel col-span-4">
      <div class="panel-head"><h3>Top Countries</h3></div>
      <div class="mini-list" id="net-top-countries"></div>
    </div>
    <div class="panel col-span-4">
      <div class="panel-head"><h3>Top IP Addresses</h3></div>
      <div class="mini-list" id="net-top-ips"></div>
    </div>
    <div class="panel col-span-4">
      <div class="panel-head"><h3>Threat Distribution</h3></div>
      <div class="chart-wrap" style="height:200px;"><canvas id="chart-threat-dist"></canvas></div>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/network.js"></script>
<script>
  SXApp.mount({ title: 'Network Intelligence', crumbs: 'SENTINEL-X / Network' });
  SXNetwork.init();
</script>
</body>
</html>
