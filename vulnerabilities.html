<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vulnerability Center — SENTINEL-X</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><path d=%22M16 2L28 7v8c0 8-5 13-12 15C9 28 4 23 4 15V7L16 2z%22 fill=%22%234f7cff%22/></svg>">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app-root"></div>

<div id="page-slot" style="display:none">
  <div class="page-head">
    <div>
      <h2>Vulnerability / CVE Center</h2>
      <p>Search published vulnerabilities via the NVD API, with a labeled demo fallback</p>
    </div>
    <span class="badge badge-neutral" id="vuln-source-badge">Checking source…</span>
  </div>

  <div class="panel">
    <div class="filter-bar">
      <div class="input-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input class="input" id="v-query" placeholder="Search CVE ID, product, or keyword…">
      </div>
      <button class="filter-chip" data-sev="">All</button>
      <button class="filter-chip" data-sev="critical">Critical</button>
      <button class="filter-chip" data-sev="high">High</button>
      <button class="filter-chip" data-sev="medium">Medium</button>
      <button class="filter-chip" data-sev="low">Low</button>
    </div>
    <div class="result-list" id="vuln-results"></div>
    <div class="pagination" id="vuln-pagination"></div>
  </div>
</div>

<div class="modal-overlay" id="vuln-modal-overlay">
  <div class="modal">
    <div class="modal-head"><h3>Vulnerability Details</h3><button class="icon-btn" id="vuln-modal-close">✕</button></div>
    <div class="modal-body" id="vuln-modal-body"></div>
    <div class="modal-foot"><button class="btn" id="vuln-modal-close2">Close</button></div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/vulnerabilities.js"></script>
<script>
  SXApp.mount({ title: 'Vulnerability Center', crumbs: 'SENTINEL-X / Vulnerabilities' });
  SXVulns.init();
</script>
</body>
</html>
